<script>
  // Dark mode constants
  const CSS_CLASS = "darkmode";
  const STORAGE_KEY = "espas-darkmode";

  /** Gets dark mode setting from localStorage. */
  const isDarkMode = JSON.parse(localStorage.getItem(STORAGE_KEY)) === 1;

  /** Toggles dark mode. */
  function toggleDarkMode() {
    // Toggle dark mode in HTML
    const newValue = document.documentElement.classList.toggle(CSS_CLASS);

    // Set dark mode setting in localStorage
    localStorage.setItem(STORAGE_KEY, Number(newValue));
  }

  // Applies dark mode setting on page load and creates dark mode toggle element
  document.addEventListener("DOMContentLoaded", function () {
    // Apply dark mode setting on page load
    if (isDarkMode) document.documentElement.classList.add(CSS_CLASS);

    // Skip toggle creation if it already exists
    if (document.getElementById("darkmode-toggle")) return;

    // Container element
    const toggleContainer = document.createElement("div");
    toggleContainer.classList.add("d-flex", "align-items-center", "editmode-switch-form");

    // Input group
    const toggleInputGroup = document.createElement("div");
    toggleInputGroup.classList.add("input-group");
    toggleContainer.appendChild(toggleInputGroup);

    // Label
    const toggleLabel = document.createElement("label");
    toggleLabel.for = "darkmode-toggle-2";
    toggleLabel.classList.add("me-2", "mb-0");
    toggleInputGroup.appendChild(toggleLabel);

    // Moon icon
    const toggleLabelIcon = document.createElement("i");
    toggleLabelIcon.classList.add("fa-solid", "fa-moon");
    toggleLabel.appendChild(toggleLabelIcon);

    // Switch container
    const toggleSwitchContainer = document.createElement("div");
    toggleSwitchContainer.classList.add("custom-control", "custom-switch");
    toggleInputGroup.appendChild(toggleSwitchContainer);

    // Input checkbox
    const toggleCheckbox = document.createElement("input");
    toggleCheckbox.id = "darkmode-toggle";
    toggleCheckbox.type = "checkbox";
    toggleCheckbox.checked = isDarkMode;
    toggleCheckbox.classList.add("custom-control-input");
    toggleCheckbox.addEventListener("change", toggleDarkMode);
    toggleSwitchContainer.appendChild(toggleCheckbox);

    // Checkbox label
    const toggleCheckboxLabel = document.createElement("span");
    toggleCheckboxLabel.innerHTML = "&nbsp;";
    toggleCheckboxLabel.classList.add("custom-control-label");
    toggleSwitchContainer.appendChild(toggleCheckboxLabel);

    // Add to navigation bar
    const navigation = document.getElementById("usernavigation");
    navigation?.prepend(toggleContainer);
  });

/* ===================================================== */
/* Quiz-Kommentar-Popup                                  */
/* ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const popupBody =
            document.querySelector(
                "body#page-mod-quiz-comment"
            );


        if (!popupBody) {
            return;
        }


        // =================================================
        // Darkmode vom Hauptfenster übernehmen
        // =================================================

        if (
            window.opener &&
            !window.opener.closed &&
            window.opener.document.body.classList.contains(
                "darkmode"
            )
        ) {

            popupBody.classList.add(
                "darkmode"
            );

        }


        // =================================================
        // Fenstergröße
        // =================================================

        const width = 950;
        const height = 1200;


        // ================================================
        // Fenster zentrieren
        // =================================================

        const left =
            (window.screen.width - width) / 2;

        const top =
            (window.screen.height - height) / 2;


        window.resizeTo(
            width,
            height
        );


        window.moveTo(
            left,
            top
        );

    }
);
</script>
