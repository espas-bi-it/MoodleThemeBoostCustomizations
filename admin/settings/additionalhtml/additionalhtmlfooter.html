<script>
  // Dark mode constants
  const CSS_CLASS = "darkmode";
  const STORAGE_KEY = "espas-darkmode";

  /** Gets dark mode setting from localStorage. */
  function isDarkMode() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) === 1;
  }

  /** Toggles dark mode. */
  function toggleDarkMode() {
    // Toggle dark mode in HTML
    const newValue = document.documentElement.classList.toggle(CSS_CLASS);

    // Set dark mode setting in localStorage
    localStorage.setItem(STORAGE_KEY, Number(newValue));
  }

  // Applies dark mode setting on page load and creates dark mode toggle element
  document.addEventListener("DOMContentLoaded", function () {
    // Apply dark mode setting on page load
    if (isDarkMode()) document.documentElement.classList.add(CSS_CLASS);

    // Skip toggle creation if it already exists
    if (document.getElementById("darkmode-toggle")) return;

    // Create container element
    const darkModeToggleContainer = document.createElement("div");
    darkModeToggleContainer.classList.add("darkmode-control");

    // Create label
    const darkModeToggleLabel = document.createElement("label");
    darkModeToggleLabel.classList.add("darkmode-switch");
    darkModeToggleContainer.appendChild(darkModeToggleLabel);

    // Create input checkbox
    const darkModeToggleCheckbox = document.createElement("input");
    darkModeToggleCheckbox.id = "darkmode-toggle";
    darkModeToggleCheckbox.setAttribute("type", "checkbox");
    darkModeToggleCheckbox.setAttribute("checked", isDarkMode());
    darkModeToggleCheckbox.addEventListener("change", toggleDarkMode);
    darkModeToggleLabel.appendChild(darkModeToggleCheckbox);

    // Create slider
    const darkModeToggleSlider = document.createElement("span");
    darkModeToggleSlider.classList.add("slider");
    darkModeToggleLabel.appendChild(darkModeToggleSlider);

    // Create label text
    const darkModeToggleText = document.createElement("span");
    darkModeToggleText.classList.add("switch-text");
    darkModeToggleLabel.appendChild(darkModeToggleText);

    // Create icon
    const darkModeToggleIcon = document.createElement("i");
    darkModeToggleIcon.classList.add("fa-solid", "fa-moon");
    darkModeToggleLabel.appendChild(darkModeToggleIcon);

    // Add dark mode switch to DOM
    document.body.appendChild(darkModeToggleContainer);
  });

/* ===================================================== */
/* Quiz-Kommentar-Popup                                  */
/* ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const popupBody =
            document.querySelector(
                "body#page-mod-quiz-comment"
            );


        if (!popupBody) {
            return;
        }


        // =================================================
        // Darkmode vom Hauptfenster übernehmen
        // =================================================

        if (
            window.opener &&
            !window.opener.closed &&
            window.opener.document.body.classList.contains(
                "darkmode"
            )
        ) {

            popupBody.classList.add(
                "darkmode"
            );

        }


        // =================================================
        // Fenstergröße
        // =================================================

        const width = 950;
        const height = 1200;


        // ================================================
        // Fenster zentrieren
        // =================================================

        const left =
            (window.screen.width - width) / 2;

        const top =
            (window.screen.height - height) / 2;


        window.resizeTo(
            width,
            height
        );


        window.moveTo(
            left,
            top
        );

    }
);
</script>
