<script>
  // Dark mode constants
  const CSS_CLASS = "darkmode";
  const STORAGE_KEY = "espas-darkmode";

  /** Gets dark mode setting from localStorage. */
  function isDarkMode() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) === 1;
  }

  /** Toggles dark mode. */
  function toggleDarkMode() {
    // Toggle dark mode in HTML
    const newValue = document.documentElement.classList.toggle(CSS_CLASS);

    // Set dark mode setting in localStorage
    localStorage.setItem(STORAGE_KEY, Number(newValue));
  }

  // Apply dark mode setting on page load
  document.addEventListener("DOMContentLoaded", function () {
    if (isDarkMode()) document.documentElement.classList.add(CSS_CLASS);
  });

/* ===================================================== */
/* Quiz-Kommentar-Popup                                  */
/* ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const popupBody =
            document.querySelector(
                "body#page-mod-quiz-comment"
            );


        if (!popupBody) {
            return;
        }


        // =================================================
        // Darkmode vom Hauptfenster übernehmen
        // =================================================

        if (
            window.opener &&
            !window.opener.closed &&
            window.opener.document.body.classList.contains(
                "darkmode"
            )
        ) {

            popupBody.classList.add(
                "darkmode"
            );

        }


        // =================================================
        // Fenstergröße
        // =================================================

        const width = 950;
        const height = 1200;


        // ================================================
        // Fenster zentrieren
        // =================================================

        const left =
            (window.screen.width - width) / 2;

        const top =
            (window.screen.height - height) / 2;


        window.resizeTo(
            width,
            height
        );


        window.moveTo(
            left,
            top
        );

    }
);
</script>

<script>
(function () {

    const storageKey = "espas-darkmode";


    function createDarkmodeButton() {

        /*
         * Falls Moodle das Script aus irgendeinem Grund
         * mehrfach ausführt, keinen zweiten Button erzeugen.
         */

        if (document.getElementById("darkmode-toggle")) {
            return;
        }


        /*
         * Container
         */

        const container =
            document.createElement("div");

        container.className =
            "darkmode-control";


        /*
         * HTML
         */

        container.innerHTML = `
            <label class="darkmode-switch">

                <input
                    type="checkbox"
                    id="darkmode-toggle"
                >

                <span class="slider"></span>

                <span class="switch-text">
                   <i class="fa-solid fa-moon"></i>
                </span>

            </label>
        `;


        /*
         * Button an BODY anhängen
         */

        document.body.appendChild(container);


        /*
         * Checkbox holen
         */

        const toggle =
            document.getElementById("darkmode-toggle");


        if (!toggle) {
            return;
        }


        /*
         * Gespeicherten Zustand lesen
         */

        let enabled = false;

        try {

            enabled =
                localStorage.getItem(storageKey) === "on";

        } catch (e) {

            enabled = false;

        }


        /*
         * Switch sofort richtig setzen
         */

        toggle.checked = enabled;


        /*
         * Klick
         */

        toggle.addEventListener(
            "change",
            function () {

                const isDark =
                    toggle.checked;


                /*
                 * Darkmode auf HTML setzen
                 */

                document.documentElement.classList.toggle(
                    "darkmode",
                    isDark
                );


                /*
                 * Zustand speichern
                 */

                try {

                    localStorage.setItem(
                        storageKey,
                        isDark ? "on" : "off"
                    );

                } catch (e) {

                    // localStorage eventuell nicht verfügbar

                }

            }
        );

    }


    /*
     * BODY existiert bereits, weil dieses Script
     * direkt vor </body> steht.
     */

    if (document.body) {

        createDarkmodeButton();

    }

})();
</script>
